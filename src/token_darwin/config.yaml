# Token-Darwin Evolution Layer Configuration
evolution:
  roi_threshold: 0.3
  max_artifacts: 100
  decay_rate: 0.95
  min_uses_to_evaluate: 3
  prune_batch_size: 10

artifact_types:
  skill:
    initial_roi: 0.5
    weight: 1.0
  tool:
    initial_roi: 0.6
    weight: 1.2
  pattern:
    initial_roi: 0.4
    weight: 0.8
  context_snippet:
    initial_roi: 0.3
    weight: 0.6

pruning:
  strategy: "roi_ranked"
  protect_recent: 5
  cooldown_generations: 3

metrics:
  track_success_rate: true
  success_rate_window: 50
  target_success_rate: 0.95
