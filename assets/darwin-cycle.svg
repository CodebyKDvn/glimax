<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="860" height="300" fill="#0d1117" rx="12"/>
  <text x="430" y="40" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="700">Token-Darwin Evolution Cycle</text>

  <!-- cycle nodes -->
  <g>
    <rect x="60" y="110" width="150" height="70" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="135" y="140" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="600">1. Register</text>
    <text x="135" y="162" text-anchor="middle" fill="#8b949e" font-size="11">new artifact, ROI₀ by type</text>

    <rect x="270" y="110" width="150" height="70" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="345" y="140" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="600">2. Use</text>
    <text x="345" y="162" text-anchor="middle" fill="#8b949e" font-size="11">record success/failure</text>

    <rect x="480" y="110" width="150" height="70" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/>
    <text x="555" y="140" text-anchor="middle" fill="#d29922" font-size="14" font-weight="600">3. Evolve</text>
    <text x="555" y="162" text-anchor="middle" fill="#8b949e" font-size="11">decay ROI ×0.95</text>

    <rect x="690" y="110" width="130" height="70" rx="10" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <text x="755" y="140" text-anchor="middle" fill="#f85149" font-size="14" font-weight="600">4. Prune</text>
    <text x="755" y="162" text-anchor="middle" fill="#8b949e" font-size="11">ROI &lt; 0.3 dies</text>
  </g>

  <!-- arrows -->
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#8b949e"/></marker></defs>
  <line x1="212" y1="145" x2="266" y2="145" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="422" y1="145" x2="476" y2="145" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="632" y1="145" x2="686" y2="145" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <!-- loop back -->
  <path d="M 755 185 Q 755 240 430 240 Q 135 240 135 185" fill="none" stroke="#484f58" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="430" y="262" text-anchor="middle" fill="#484f58" font-size="11">survivors re-enter the pool each generation</text>

  <text x="430" y="86" text-anchor="middle" fill="#8b949e" font-size="12">ROI = 0.8 × success_rate + 0.2 × min(use_count / 10, 1)</text>
</svg>