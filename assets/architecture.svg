<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="darwin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f78166"/>
      <stop offset="1" stop-color="#d29922"/>
    </linearGradient>
    <linearGradient id="genome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
  </defs>

  <rect width="880" height="520" fill="url(#bg)" rx="12"/>
  <text x="440" y="46" text-anchor="middle" fill="#e6edf3" font-size="24" font-weight="700">Glimax — Token-Economy Toolkit for Claude Code</text>

  <!-- Claude Code layer -->
  <rect x="60" y="80" width="760" height="80" rx="10" fill="#21262d" stroke="#30363d"/>
  <text x="440" y="108" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="600">Claude Code</text>
  <text x="440" y="134" text-anchor="middle" fill="#8b949e" font-size="13">skills/ (token-darwin · project-genome)  ·  commands/ (/darwin · /genome)  ·  cli/glimax.py</text>

  <!-- arrows down -->
  <line x1="250" y1="160" x2="250" y2="200" stroke="#f78166" stroke-width="2" marker-end="url(#arw1)"/>
  <line x1="630" y1="160" x2="630" y2="200" stroke="#58a6ff" stroke-width="2" marker-end="url(#arw2)"/>
  <defs>
    <marker id="arw1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f78166"/></marker>
    <marker id="arw2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#58a6ff"/></marker>
  </defs>

  <!-- Token Darwin card -->
  <rect x="60" y="200" width="370" height="230" rx="10" fill="#161b22" stroke="url(#darwin)" stroke-width="2"/>
  <text x="245" y="232" text-anchor="middle" fill="#f78166" font-size="18" font-weight="700">token-darwin</text>
  <text x="245" y="254" text-anchor="middle" fill="#8b949e" font-size="12">ROI-based natural selection of artifacts</text>
  <text x="80" y="286" fill="#c9d1d9" font-size="13">• register skills / tools / patterns</text>
  <text x="80" y="310" fill="#c9d1d9" font-size="13">• record usage → ROI = 0.8·SR + 0.2·freq</text>
  <text x="80" y="334" fill="#c9d1d9" font-size="13">• evolve: decay ×0.95 / gen, prune ROI &lt; 0.3</text>
  <text x="80" y="358" fill="#c9d1d9" font-size="13">• capacity cap 100, protect 5 most recent</text>
  <text x="80" y="382" fill="#c9d1d9" font-size="13">• context budget injection ≤ N tokens</text>
  <text x="80" y="410" fill="#8b949e" font-size="12">state: .darwin_state.json (persists generations)</text>

  <!-- Project Genome card -->
  <rect x="450" y="200" width="370" height="230" rx="10" fill="#161b22" stroke="url(#genome)" stroke-width="2"/>
  <text x="635" y="232" text-anchor="middle" fill="#58a6ff" font-size="18" font-weight="700">project-genome</text>
  <text x="635" y="254" text-anchor="middle" fill="#8b949e" font-size="12">codebase → ≤2k-token genome</text>
  <text x="470" y="286" fill="#c9d1d9" font-size="13">• ArchitectureDNA — langs, fw, entry points</text>
  <text x="470" y="310" fill="#c9d1d9" font-size="13">• DependencyGraph — deps + hotspots</text>
  <text x="470" y="334" fill="#c9d1d9" font-size="13">• PatternLibrary — conventions, anti-patterns</text>
  <text x="470" y="358" fill="#c9d1d9" font-size="13">• SemanticIndex — modules, APIs, terms</text>
  <text x="470" y="382" fill="#c9d1d9" font-size="13">• EvolutionMemory — recent git changes</text>
  <text x="470" y="410" fill="#8b949e" font-size="12">synthesize_context(task) → ~1.2k relevant tokens</text>

  <!-- bottom bar -->
  <rect x="60" y="455" width="760" height="42" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="440" y="482" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="600">≥70% context reduction  ·  ≥95% success-rate target  ·  zero runtime dependencies</text>
</svg>