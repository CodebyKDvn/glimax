<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 572" width="840" height="572" role="img" aria-label="Section drawing of the four memory layers: L0 frozen snapshot, L1 working set, L2 bi-temporal graph, L3 verbatim vault, with a lift carrying the recall packet and a genome annex">
<rect x="0" y="0" width="840" height="572" fill="#0F1727" />
<text x="44" y="54" font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif" font-size="27" fill="#EDE7D7" font-weight="600">Section through the palace</text>
<text x="44" y="78" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#9C9584">four layers in one SQLite file — the write path costs no context tokens</text>
<rect x="150" y="168" width="490" height="70" fill="#141D30" stroke="none"/>
<text x="166" y="198" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#F2C14E" font-weight="600">L0</text>
<text x="200" y="198" font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif" font-size="19" fill="#EDE7D7">Frozen snapshot</text>
<text x="200" y="217" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#9C9584">one AAAK block per session, never rewritten inside it</text>
<rect x="150" y="238" width="490" height="62" fill="#141D30" stroke="none"/>
<text x="166" y="268" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#F2C14E" font-weight="600">L1</text>
<text x="200" y="268" font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif" font-size="19" fill="#EDE7D7">Working set</text>
<text x="200" y="287" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#9C9584">keys already injected — the gate cannot repeat itself</text>
<rect x="150" y="300" width="490" height="110" fill="#141D30" stroke="none"/>
<text x="166" y="330" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#F2C14E" font-weight="600">L2</text>
<text x="200" y="330" font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif" font-size="19" fill="#EDE7D7">Bi-temporal graph</text>
<text x="200" y="349" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#9C9584">facts with valid_from / valid_until, engrams, interceptors</text>
<rect x="150" y="410" width="490" height="110" fill="#141D30" stroke="none"/>
<text x="166" y="440" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#F2C14E" font-weight="600">L3</text>
<text x="200" y="440" font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif" font-size="19" fill="#EDE7D7">Verbatim vault</text>
<text x="200" y="459" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#9C9584">every turn, exact bytes, FTS5 + trigram + simhash</text>
